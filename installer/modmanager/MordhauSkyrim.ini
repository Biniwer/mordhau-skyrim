; MORDHAU x Skyrim - settings. Everything can stay as it is.

; MORDHAU's folder (the one that holds "Mordhau\Binaries"), only when it is not in a Steam library.
; Example: MordhauPath=D:\Games\Mordhau
MordhauPath=

; Where MORDHAU's models are prepared (about 2 GB). Empty: %LOCALAPPDATA%\MordhauSkyrim\cache
CacheFolder=

; Size of MORDHAU's window behind Skyrim. Its crosshair, attack-direction indicator and voice / emote menu are read
; from it: bigger is sharper.
MordhauWidth=1920
MordhauHeight=1080

; 1: enemies only copy the Skyrim character's attack and block timing (easier). 0: MORDHAU's own bot brains.
SimpleEnemies=0

; 0: the mod starts nothing by itself (Skyrim plays as usual).
StartMordhau=1
